# Conservative defaults from the Stage 1 design package.
# Every risk value can be made stricter here. A value looser than its hard
# ceiling (src/bot/core/config.py) is refused at startup.

environment: paper        # sim | paper | testnet | demo | live
live_trading: false       # true only with environment: live AND the typed confirmation

universe:
  - BTCUSDT
  - ETHUSDT

risk:
  risk_per_trade_pct: 0.25      # R-01, ceiling 0.5
  daily_loss_pct: 1.5           # R-02, ceiling 1.5 (of day-start equity)
  weekly_loss_pct: 3            # R-03, ceiling 3 (of week-start equity)
  max_open_positions: 3         # R-04
  max_open_risk_pct: 1.5        # R-05, total open stop risk
  max_invested_pct: 50          # R-06
  max_coin_exposure_pct: 25     # R-07
  corr_threshold: 0.8           # R-08: above this, coins share a group
  max_per_corr_group: 2         # R-08
  drawdown_breaker_pct: 6       # R-09, ceiling 10 (decision D-06)
  min_reward_risk: 1.5          # R-10, floor 1.0
  max_spread_pct: 0.10          # R-11
  min_quote_volume_24h: 20000000
  min_depth_multiple: 5
  max_data_age_s: 10            # R-12
  max_clock_skew_ms: 500        # R-13, ceiling 1000
  entry_slippage_pct: 0.05
  default_stop_slippage_pct: 1.0
  stop_slippage_pct:            # raised for ETH after the 3-year history review
    BTCUSDT: 0.5
    ETHUSDT: 1.0
  auto_clear_daily_block: false
